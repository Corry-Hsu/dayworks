<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#fafbfe"><title>日期計算 · 色塊版</title><meta name="description" content="點選日期，直接查看相隔天數與工期；無廣告、無追蹤。"><link rel="stylesheet" href="redesign.css"><link rel="stylesheet" href="../navigation.css"></head><body class="blocks"><header class="tool-header"><nav class="primary-tabs" aria-label="主要工具"><a href="../between/timeline.html" aria-current="page">日期計算</a><a href="../between/memories.html">工程紀錄</a><a href="../plus/dark.html" class="plus-link">日期加減</a></nav></header><div class="modebar"><nav class="versions secondary-tabs" aria-label="日期計算顯示模式"><a href="timeline.html" data-style="timeline">時間軸</a><a href="blocks.html" data-style="blocks">色塊</a></nav></div><main><div class="blocks-layout"><section class="result" aria-label="計算結果" aria-live="polite"><p id="result-label">相隔</p><div class="number"><strong id="total">—</strong><span>天</span></div><div class="secondary-result"><span id="secondary-label">含頭含尾</span><b id="secondary">—</b></div><div id="ratio" class="ratio" hidden><div class="ratio-track"><i id="ratio-work"></i></div><div class="ratio-labels"><span id="ratio-working"></span><span id="ratio-rest"></span></div></div><label class="project-label" for="project-name">工程／事項名稱</label><input id="project-name" class="project-name" type="text" maxlength="120" placeholder="例如：校內道路鋪面改善"><button id="save" class="save" disabled>儲存紀錄</button><a class="result-memory" href="memories.html">查看工程紀錄</a><p id="error" class="error" role="status"></p></section><div class="blocks-controls panel"><div class="modes" role="group" aria-label="計算模式"><button data-mode="date" aria-pressed="true">日期相隔</button><button data-mode="work" aria-pressed="false">工作天</button><button data-mode="finish" aria-pressed="false">推算完工日</button></div><div id="finish-inputs" class="finish-inputs" hidden><label for="required-days">所需工作天數</label><input id="required-days" type="number" min="1" step="1" value="30"><label class="include-start"><input id="include-start" type="checkbox" checked>開工當天為工作日則計入第 1 天</label></div><div class="dates"><label>起始日<input type="date" id="start" min="0001-01-01" max="9999-12-31" required></label><span aria-hidden="true">／</span><label>終止日<input type="date" id="end" min="0001-01-01" max="9999-12-31" required></label></div><div class="presets" aria-label="快速區間"><button data-range="today">今天</button><button data-range="week">本週</button><button data-range="month">本月</button><button id="reset">清空</button></div><details id="settings" class="disclosure" hidden><summary>排除設定 <span id="setting-label">六・日・國定假日</span></summary><div class="setting-options"><label><input type="checkbox" id="saturday" checked>星期六</label><label><input type="checkbox" id="sunday" checked>星期日</label><label><input type="checkbox" id="holidays" checked>2026–2027 國定假日</label></div><a class="source" href="https://www.dgpa.gov.tw/information?pid=12983&amp;uid=2" target="_blank" rel="noopener noreferrer">假日來源</a></details></div><section class="calendar panel" aria-label="互動月曆"><div class="calendar-head"><button id="prev" aria-label="上個月">‹</button><h2 id="month-title"></h2><button id="next" aria-label="下個月">›</button></div><p id="selection-prompt" class="selection-prompt" role="status">點選起始日</p><div class="weekdays" aria-hidden="true"><span>日</span><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span></div><div id="calendar-grid" class="calendar-grid"></div><div class="legend"><span><i class="legend-selected"></i>已選區間</span><span><i class="legend-excluded"></i>排除日</span></div></section><section class="strip-panel panel" aria-label="日期區間視覺化"><div class="strip-heading"><h2>日期區間</h2><span id="strip-caption"></span></div><div class="strip" id="strip"></div><p id="strip-note" class="micro"></p><p id="day-info" class="day-info" role="status">點選日期格查看</p></section></div><section class="bottom"><details class="disclosure"><summary>計算明細 <span id="detail-count"></span></summary><div id="detail-content"></div><details class="rules"><summary>計算規則</summary><p>相隔天數取絕對值；含頭含尾加一天。工期包含起訖日，週末與假日重疊只扣一次。內建國定假日與補假涵蓋 2026–2027 年；企業排休請依實際約定調整。</p></details></details><details class="disclosure"><summary>儲存紀錄 <span id="history-count">0</span></summary><div id="history-tabs" class="history-tabs"><button data-history="date" aria-pressed="true">日期相隔</button><button data-history="work" aria-pressed="false">工作天</button></div><div id="history"></div><button id="clear-history" class="quiet">清除此類紀錄</button><p class="micro">僅保存在此瀏覽器。</p></details></section></main><footer><span>無廣告 · 無追蹤</span><details><summary>隱私</summary><p>日期只在瀏覽器計算；儲存紀錄使用本機空間，不會上傳。網站主機可能保留一般存取紀錄。</p></details></footer><div id="toast" role="status"></div><script type="module" src="redesign.mjs"></script><script type="module" src="wheel.mjs"></script></body></html>
