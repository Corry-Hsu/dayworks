<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>工程紀錄｜日期與工期</title><link rel="stylesheet" href="redesign.css"><link rel="stylesheet" href="memories.css"><link rel="stylesheet" href="../navigation.css"></head><body><header class="tool-header"><nav class="primary-tabs" aria-label="主要工具"><a href="../between/timeline.html">日期計算</a><a href="../between/memories.html" aria-current="page">工程紀錄</a><a href="../plus/dark.html">日期加減</a></nav></header><main class="memories"><div class="memory-heading"><h1>工程紀錄</h1><button id="open-import" type="button">匯入舊紀錄</button><input type="file" id="import-records" accept=".json,application/json" hidden><button id="export" type="button">匯出紀錄</button></div><label class="search-label" for="search">搜尋工程、日期或結果</label><input id="search" type="search" placeholder="輸入工程名稱或日期" autocomplete="off"><div class="memory-filters" role="group" aria-label="紀錄類型"><button data-kind="work" aria-pressed="false">工程工期</button><button data-kind="date" aria-pressed="false">日期相隔</button><button data-kind="all" aria-pressed="true">全部</button></div><p id="memory-count" role="status"></p><p id="storage-error" role="alert"></p><div id="memory-list"></div><details class="memory-note"><summary>資料保存方式</summary><p>紀錄僅保存在這個網站、這個瀏覽器。不同裝置不會同步；清除網站資料或結束無痕模式可能移除紀錄。請定期匯出留存。舊版紀錄仍可查閱，但可能沒有工程名稱、儲存時間或完整排除設定。</p></details></main><p id="toast" role="status"></p><script type="module" src="memories.mjs"></script></body></html>
