<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="無廣告日期加減計算機：輸入起始日期與正負天數，即時查看結果日期、星期與月曆。"><meta name="theme-color" content="#263bb7"><title>日期加減｜無廣告</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="../navigation.css"></head><body>
<header class="tool-header"><nav class="primary-tabs" aria-label="主要工具"><a href="../between/timeline.html" class="other-tool">日期計算</a><a href="../between/memories.html">工程紀錄</a><a href="../plus/dark.html" aria-current="page">日期加減</a></nav></header><div class="modebar"><nav class="themes" aria-label="介面風格"><a href="index.html" data-theme="light" aria-current="page">淺色</a><a href="dark.html" data-theme="dark">深色</a></nav></div>
<main><div class="calculator"><section class="controls" aria-label="日期加減設定"><form id="calculator"><label for="start">起始日期</label><div class="start-row"><input type="date" id="start" min="0001-01-01" max="9999-12-31" required><button type="button" id="today" class="quiet">今天</button></div><p id="start-weekday" class="weekday">—</p>
<div class="direction" role="group" aria-label="加減方向"><button type="button" id="forward" aria-pressed="true"><span aria-hidden="true">＋</span>往後</button><button type="button" id="backward" aria-pressed="false"><span aria-hidden="true">−</span>往前</button></div>
<label for="offset">天數</label><div class="stepper"><button type="button" id="minus" aria-label="減少一天">−</button><input type="number" id="offset" step="1" value="7" required aria-describedby="offset-help"><span class="unit">天</span><button type="button" id="plus" aria-label="增加一天">＋</button></div><div class="quick" role="group" aria-label="快速選擇天數"><button type="button" data-days="7">7 天</button><button type="button" data-days="14">14 天</button><button type="button" data-days="30">30 天</button><button type="button" data-days="90">90 天</button></div>
<div class="actions"><button type="submit" class="primary">計算日期</button><button type="button" id="clear" class="clear">清除</button></div><p id="error" class="error" role="status"></p></form>
<details class="help"><summary>計算方式</summary><p id="offset-help">往後加天數，往前減天數，也可直接輸入負數。起始日為第 0 天；加 1 天就是隔天。所有天數均為日曆天，包含週末與假日。</p></details></section>
<section class="result" aria-label="結果日期"><div class="equation"><span id="equation-start">—</span><span id="equation-offset" class="offset-badge">＋7 天</span></div><div class="result-main" aria-live="polite"><p id="result-caption">計算結果</p><div class="date-display"><span id="result-month">—</span><strong id="result-day">—</strong><span id="result-weekday">—</span></div><p id="result-iso">—</p></div><div class="result-actions"><button type="button" id="copy" disabled>複製日期</button><button type="button" id="continue" disabled>設為起始日</button></div><a id="send-to-work" class="send-to-work" href="../between/timeline.html?mode=work" hidden>以此區間計算工期</a></section></div>
<section class="visual" aria-label="結果月曆"><div class="visual-heading"><div class="month-nav"><button id="prev" aria-label="上個月">‹</button><h1 id="month-title"></h1><button id="next" aria-label="下個月">›</button></div><div class="legend"><span><i class="origin"></i>起始</span><span><i class="destination"></i>結果</span></div></div><p id="calendar-empty" class="calendar-empty" hidden>選擇日期，月曆將標記計算結果。</p><div id="calendar-body"><div class="weekdays" aria-hidden="true"><span>日</span><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span></div><div id="calendar-grid" class="calendar-grid"></div></div><div class="calendar-bottom"><p id="calendar-info" role="status">點選日期可設為起始日</p><button id="back-to-result" class="quiet" disabled>結果月份</button></div></section>
</main><footer><span>無廣告 · 無追蹤</span><details><summary>隱私</summary><p>所有日期在瀏覽器計算，不上傳、不儲存，也不使用第三方追蹤或外部字型。主機可能保留一般存取紀錄。</p></details></footer><p id="toast" role="status"></p><script type="module" src="app.mjs"></script></body></html>
