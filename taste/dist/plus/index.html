<!doctype html><html lang="zh-Hant" data-type="software" data-radius="sharp" data-buttons="solid" data-motion><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="page-type" content="software"><meta name="site-kind" content="software"><meta name="description" content="工程日期工作台：日期工期、加減日期與可搜尋的工程紀錄。"><meta name="theme-color" content="#0f0f0f"><title>日期加減｜工程日期工作台</title><link rel="stylesheet" href="../workbench.css"><link rel="stylesheet" href="../assets/motion/motion.css"><script>document.documentElement.classList.add('m-enter');setTimeout(()=>document.documentElement.classList.add('m-enter-done'),700)</script></head><body><!-- software; soot-pale-lime; Funnel + DM Mono; application adaptation: live tools, no marketing screens --><a class="skip-link" href="#workspace">跳至工具</a><aside class="app-nav"><a class="app-brand" href="../between/calendar.html">工程日期<span>工作台</span></a><nav aria-label="工具"><a class="other-tool" href="../between/calendar.html">日期與工期</a><a href="../plus/dark.html" aria-current="page">日期加減</a><a href="../between/memories.html">工程紀錄</a></nav><div class="nav-foot"><span>2026 臺灣假日</span><span>本機資料儲存</span></div></aside><main id="workspace"><section class="hero app-heading" data-enter><div><p>工程日期工作台</p><h1>日期加減</h1></div><span class="local-badge">僅儲存在此瀏覽器</span></section><div class="plus-grid"><div class="input-stack"><section class="controls" aria-label="日期加減設定"><form id="calculator"><label for="start">起始日期</label><div class="start-row"><input type="date" id="start" min="0001-01-01" max="9999-12-31" required><button type="button" id="today" class="btn quiet">今天</button></div><p id="start-weekday" class="weekday">—</p>
<div class="direction" role="group" aria-label="加減方向"><button class="btn" type="button" id="forward" aria-pressed="true"><span aria-hidden="true">＋</span>往後</button><button class="btn" type="button" id="backward" aria-pressed="false"><span aria-hidden="true">−</span>往前</button></div>
<label for="offset">天數</label><div class="stepper"><button class="btn" type="button" id="minus" aria-label="減少一天">−</button><input type="number" id="offset" step="1" value="7" required aria-describedby="offset-help"><span class="unit">天</span><button class="btn" type="button" id="plus" aria-label="增加一天">＋</button></div><div class="quick" role="group" aria-label="快速選擇天數"><button class="btn" type="button" data-days="7">7 天</button><button class="btn" type="button" data-days="14">14 天</button><button class="btn" type="button" data-days="30">30 天</button><button class="btn" type="button" data-days="90">90 天</button></div>
<div class="actions"><button type="submit" class="btn primary">計算日期</button><button type="button" id="clear" class="btn clear">清除</button></div><p id="error" class="error" role="status"></p></form>
<details class="help"><summary>計算方式</summary><p id="offset-help">往後加天數，往前減天數，也可直接輸入負數。起始日為第 0 天；加 1 天就是隔天。所有天數均為日曆天，包含週末與假日。</p></details></section><section class="result" aria-label="結果日期"><div class="equation"><span id="equation-start">—</span><span id="equation-offset" class="offset-badge">＋7 天</span></div><div class="result-main" aria-live="polite"><p id="result-caption">計算結果</p><div class="date-display"><span id="result-month">—</span><strong id="result-day">—</strong><span id="result-weekday">—</span></div><p id="result-iso">—</p></div><div class="result-actions"><button class="btn" type="button" id="copy" disabled>複製日期</button><button class="btn" type="button" id="continue" disabled>設為起始日</button></div><a id="send-to-work" class="send-to-work" href="../between/calendar.html?mode=work" hidden>以此區間計算工期</a></section></div><section class="visual" aria-label="結果月曆"><div class="visual-heading"><div class="month-nav"><button class="btn" id="prev" aria-label="上個月">‹</button><h1 id="month-title"></h1><button class="btn" id="next" aria-label="下個月">›</button></div><div class="legend"><span><i class="origin"></i>起始</span><span><i class="destination"></i>結果</span></div></div><p id="calendar-empty" class="calendar-empty" hidden>選擇日期，月曆將標記計算結果。</p><div id="calendar-body"><div class="weekdays" aria-hidden="true"><span>日</span><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span></div><div id="calendar-grid" class="calendar-grid"></div></div><div class="calendar-bottom"><p id="calendar-info" role="status">點選日期可設為起始日</p><button id="back-to-result" class="btn quiet" disabled>結果月份</button></div></section></div><footer><span>無廣告 · 無追蹤</span><details><summary>使用與資料</summary><p>假日資料僅含2026年。工程紀錄儲存在本機，請匯出留存；不同網域與裝置不會自動同步。</p></details></footer></main><p id="toast" role="status"></p><script type="module" src="app.mjs"></script><script type="module" src="../assets/system.js"></script><script type="module" src="../assets/motion/motion.js"></script></body></html>
